version: "3.8"

services:
  # === OneBot 协议前端 ===
  # 请使用你选择的 OneBot v11 实现（如 NapCat、Lagrange.OneBot、OpenShamrock 等）
  # 此处以 NapCat 为例，请参考对应项目的部署文档
  # NapCat 项目地址: https://github.com/NapNeko/NapCatQQ
  onebot:
    # 请替换为你使用的 OneBot 实现的 Docker 镜像
    # NapCat Docker: mlikiowa/napcat-docker:latest
    image: mlikiowa/napcat-docker:latest
    container_name: onebot
    restart: unless-stopped
    environment:
      - ACCOUNT=你的QQ号
      - WS_URL=ws://qq-bot:8080
      - TOKEN=your-websocket-token
    ports:
      - "6099:6099"
    volumes:
      - onebot-data:/app/napcat
    networks:
      - bot-net

  # === QQ 机器人框架 ===
  qq-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qq-bot
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI 管理界面
      - "8080:8080"   # OneBot WebSocket 反向连接端口
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - bot-net
    depends_on:
      - onebot

networks:
  bot-net:
    driver: bridge

volumes:
  onebot-data:
